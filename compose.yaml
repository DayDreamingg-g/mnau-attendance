name: mnau-attendance
x-app-env: &app-env
  DATABASE_URL: postgresql://attendance_app:${APP_DB_PASSWORD:?Run setup:env}@postgres:5432/mnau_attendance?schema=public
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  APP_ENV: ${APP_ENV:-demo}
  DEMO_MODE: ${DEMO_MODE:-false}
  DEMO_DATE: ${DEMO_DATE:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  REPORT_MACHINE_TOKEN: ${REPORT_MACHINE_TOKEN:?Run setup:env}
  REPORT_FACULTY_SLUG: management
services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run setup:env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run setup:env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Run setup:env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment: *app-env
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
  migrate:
    build: { context: ., target: tools }
    profiles: [tools]
    environment: *app-env
    command: [npm, run, db:migrate]
    depends_on:
      postgres: { condition: service_healthy }
  seed:
    build: { context: ., target: tools }
    profiles: [tools]
    environment: *app-env
    command: [npm, run, db:seed]
    depends_on:
      postgres: { condition: service_healthy }
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.37.10
    restart: unless-stopped
    ports: ["127.0.0.1:${N8N_PORT:-5678}:5678"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: mnau_n8n
      DB_POSTGRESDB_USER: n8n_app
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Run setup:env}
      DB_POSTGRESDB_SCHEMA: public
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run setup:env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      GENERIC_TIMEZONE: Europe/Kyiv
      TZ: Europe/Kyiv
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  n8n_data:
